name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The app ships on all three; OS-specific code paths (paths, login items, signing) deserve a run each.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          check-latest: true
      - name: Repository guard
        run: node scripts/check-repo.mjs
      # pnpm installed the same way as on a developer machine; through corepack it wants to rewrite the lockfile.
      - run: npm install -g pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      # Make sure Electron's binary is in place before tests load it; on Windows the install can leave it unfinished.
      - run: pnpm --filter @loud/desktop exec install-electron
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Boots the built app on a demo profile and asks for a screenshot; Linux has no display.
      - name: Smoke test the built app
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.mjs
      - name: Smoke test the built app
        if: runner.os != 'Linux'
        run: node scripts/smoke.mjs
