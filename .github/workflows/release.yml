name: Release

# A version tag builds the installers on each OS and uploads them to a draft GitHub Release, with the files the
# in-app updater reads. Publishing the draft is a person's decision. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          check-latest: true
      - name: Repository guard
        run: node scripts/check-repo.mjs
      # The bundled corepack can lag behind the pnpm release in packageManager.
      - run: npm install -g corepack@latest
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # electron-builder wants the notarization key as a file.
      - name: Write the App Store Connect key
        if: runner.os == 'macOS'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$KEY" ]; then
            printf '%s' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
      - name: Package and upload to the draft release
        run: pnpm --filter @loud/desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows: a code-signing certificate (base64 .pfx) and its password.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # macOS: a Developer ID certificate, and an App Store Connect API key for notarization.
          # (Only on macOS, so Windows never falls back to the Apple certificate.)
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
