name: Release

# A version tag builds the installers on each OS and uploads them to a draft GitHub Release, with the files the
# in-app updater reads. Publishing the draft is a person's decision. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          check-latest: true
      - name: Repository guard
        run: node scripts/check-repo.mjs
      # pnpm installed the same way as on a developer machine; through corepack it wants to rewrite the lockfile.
      - run: npm install -g pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      # Make sure Electron's binary is in place before tests load it; on Windows the install can leave it unfinished.
      - run: pnpm --filter @loud/desktop exec install-electron
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # electron-builder wants the notarization key as a file.
      - name: Write the App Store Connect key
        if: runner.os == 'macOS'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$KEY" ]; then
            printf '%s' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
      # An empty CSC_LINK reads as a path, so it is set only when the secret exists; without it, the app is not signed.
      - name: macOS signing certificate
        if: runner.os == 'macOS'
        env:
          LINK: ${{ secrets.MAC_CSC_LINK }}
          PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$LINK" ]; then
            echo "CSC_LINK=$LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
      - name: Package and upload to the draft release
        run: pnpm --filter @loud/desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows: a code-signing certificate (base64 .pfx) and its password.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # macOS: the certificate is set in the step above; this API key is for notarization.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
